<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" dir="{{ .Site.Language.LanguageDirection | default "ltr" }}">

    {{ .Scratch.Add "trace" (slice "<baseof>") }}

    {{- partial "head.html" . -}}
    <body data-theme="dark">
        <div class="container">
        {{- partial "header.html" . -}}
        <div class="content">
            {{- block "main" . }}{{- end }}
        </div>
        {{- partial "footer.html" . -}}
        </div>
    {{ .Scratch.Add "trace" (slice "</baseof>") }}
    
    <div class="container">
    {{ partial "__layouttrace/generatetrace" . }}
    {{ partial "__layouttrace/rendertrace" . }}
    </div>

    </body>
</html>
